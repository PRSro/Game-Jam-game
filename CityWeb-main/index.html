<!doctype html>
<html lang="ro-RO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <script>
        // Applied before first paint so a reload does not flash the wrong theme.
        // When nothing is stored we leave data-theme unset and let the CSS
        // prefers-color-scheme query follow the OS.
        try {
          var stored = localStorage.getItem('piata.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored;
          }
        } catch (error) {
          // Storage blocked: fall back to the OS preference.
        }
      </script>
    <meta name="theme-color" content="#EDE4D0" />
    <meta
      name="description"
      content="Piața — hartă vie a Bucureștiului. Evenimente, locuri, joburi, sondaje și oameni, conectate prin unde, când și cine."
    />
    <meta property="og:title" content="Piața — hartă vie a Bucureștiului" />
    <meta property="og:type" content="website" />
    <title>Piața — hartă vie a Bucureștiului</title>
    <!-- Modern Typography: Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
